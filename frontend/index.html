<!doctype html>
<html lang="hi" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#000000" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="apple-mobile-web-app-title" content="AUTONEXIS" />

    <title>AUTONEXIS Assistant</title>
    <meta name="description" content="AUTONEXIS Assistant — Thoughtful, quiet, and intelligent AI assistant." />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="AUTONEXIS Assistant" />
    <meta property="og:description" content="Thoughtful, quiet, and intelligent AI assistant." />
    <meta property="og:image" content="/brand/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="/brand/og-image.png" />

    <!-- Icons & PWA Manifest -->
    <link rel="icon" href="/favicon.ico" />
    <link rel="icon" type="image/png" href="/favicon.png?v=20261111" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=20261111" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png?v=20261111" />
    <link rel="manifest" href="/manifest.webmanifest?v=20261111" />

    <!-- Lightweight pure-black iOS startup images -->
    <link rel="apple-touch-startup-image" href="/brand/splash-750x1334.png" media="(device-width: 375px) and (device-height: 667px) and (-webkit-device-pixel-ratio: 2)" />
    <link rel="apple-touch-startup-image" href="/brand/splash-1170x2532.png" media="(device-width: 390px) and (device-height: 844px) and (-webkit-device-pixel-ratio: 3)" />
    <link rel="apple-touch-startup-image" href="/brand/splash-1179x2556.png" media="(device-width: 393px) and (device-height: 852px) and (-webkit-device-pixel-ratio: 3)" />
    <link rel="apple-touch-startup-image" href="/brand/splash-1284x2778.png" media="(device-width: 428px) and (device-height: 926px) and (-webkit-device-pixel-ratio: 3)" />
    <link rel="apple-touch-startup-image" href="/brand/splash-1290x2796.png" media="(device-width: 430px) and (device-height: 932px) and (-webkit-device-pixel-ratio: 3)" />

    <!-- Preload self-hosted brand & body Latin subsets cleanly (zero external CDN) -->
    <link rel="preload" as="font" type="font/woff2" href="/fonts/michroma-latin-400.woff2" crossorigin />
    <link rel="preload" as="font" type="font/woff2" href="/fonts/inter-latin.woff2" crossorigin />

    <!-- Critical Splash + First-Paint Styles (zero flash between Stage 0 & Stage 1) -->
    <style>
      @font-face {
        font-family: "Michroma";
        src: url("/fonts/michroma-latin-400.woff2") format("woff2");
        font-weight: 400;
        font-style: normal;
        font-display: swap;
      }
      html.splash-booting,
      html.splash-booting body {
        background-color: #000000 !important;
      }
      #autonexis-splash {
        position: fixed;
        inset: 0;
        z-index: 9999;
        background-color: #000000;
        color: #ffffff;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        opacity: 1;
        transition: opacity 300ms ease;
      }
      #autonexis-splash.is-hidden {
        display: none;
      }
      #autonexis-splash.is-fading-out {
        opacity: 0;
        pointer-events: none;
      }
      .anx-splash-inner {
        display: flex;
        flex-direction: column;
        align-items: center;
        text-align: center;
        transform: translateY(-5%);
        animation: anxSplashIn 400ms cubic-bezier(0.22, 1, 0.36, 1) forwards;
      }
      .anx-splash-mark-wrap {
        position: relative;
        width: 112px;
        height: 112px;
        background-color: #000000;
        border-radius: 26px;
        overflow: hidden;
        display: flex;
        align-items: center;
        justify-content: center;
        margin-bottom: 22px;
      }
      .anx-splash-mark-wrap::after {
        content: "";
        position: absolute;
        inset: 0;
        background: linear-gradient(110deg, transparent 30%, rgba(255, 255, 255, 0.28) 50%, transparent 70%);
        -webkit-mask-image: url("/brand/logo-mark.png");
        -webkit-mask-size: contain;
        -webkit-mask-position: center;
        -webkit-mask-repeat: no-repeat;
        mask-image: url("/brand/logo-mark.png");
        mask-size: contain;
        mask-position: center;
        mask-repeat: no-repeat;
        transform: translateX(-120%);
        animation: anxLightSweep 1.2s ease-out 0.15s 1 forwards;
        pointer-events: none;
      }
      .anx-splash-mark-img {
        width: 100%;
        height: 100%;
        object-fit: contain;
        display: block;
      }
      .anx-splash-wordmark {
        font-family: "Michroma", -apple-system, BlinkMacSystemFont, sans-serif;
        font-size: 20px;
        font-weight: 400;
        letter-spacing: 0.42em;
        text-indent: 0.42em;
        color: #ffffff;
        margin-bottom: 8px;
      }
      .anx-splash-tagline {
        font-family: "Michroma", -apple-system, BlinkMacSystemFont, sans-serif;
        font-size: 10px;
        letter-spacing: 0.28em;
        text-indent: 0.28em;
        text-transform: uppercase;
        color: rgba(255, 255, 255, 0.42);
        margin-bottom: 20px;
      }
      .anx-splash-line-track {
        position: relative;
        width: 132px;
        height: 1px;
        background-color: rgba(255, 255, 255, 0.14);
        overflow: hidden;
        border-radius: 1px;
      }
      .anx-splash-line-bar {
        position: absolute;
        top: 0;
        left: 0;
        width: 44px;
        height: 1px;
        background-color: rgba(255, 255, 255, 0.85);
        animation: anxLineMove 1.15s ease-in-out infinite;
      }
      .anx-splash-slow {
        display: none;
        margin-top: 26px;
        max-width: 300px;
        text-align: center;
      }
      .anx-splash-slow.visible {
        display: block;
      }
      .anx-splash-slow p {
        font-family: -apple-system, BlinkMacSystemFont, sans-serif;
        font-size: 13px;
        color: rgba(255, 255, 255, 0.72);
        margin: 0 0 12px 0;
      }
      .anx-splash-reload-btn {
        font-family: "Michroma", -apple-system, BlinkMacSystemFont, sans-serif;
        font-size: 13px;
        padding: 10px 22px;
        border-radius: 999px;
        border: 1px solid rgba(255, 255, 255, 0.24);
        background: #ffffff;
        color: #000000;
        cursor: pointer;
      }
      @keyframes anxSplashIn {
        from { opacity: 0; transform: translateY(-5%) scale(0.98); }
        to { opacity: 1; transform: translateY(-5%) scale(1); }
      }
      @keyframes anxLightSweep {
        from { transform: translateX(-120%); }
        to { transform: translateX(120%); }
      }
      @keyframes anxLineMove {
        0% { transform: translateX(-44px); }
        100% { transform: translateX(132px); }
      }
      @media (prefers-reduced-motion: reduce) {
        .anx-splash-inner {
          animation: anxPlainFade 300ms ease forwards;
        }
        .anx-splash-mark-wrap::after {
          display: none;
          animation: none;
        }
        .anx-splash-line-bar {
          width: 100%;
          opacity: 0.55;
          animation: none;
        }
        @keyframes anxPlainFade {
          from { opacity: 0; }
          to { opacity: 1; }
        }
      }
    </style>

    <!-- Cold-start detection + anti-flash theme setup before first paint -->
    <script>
      (function() {
        var isColdStart = true;
        try {
          isColdStart = sessionStorage.getItem("autonexis_splash_done") !== "1";
        } catch (e) {
          isColdStart = false;
        }
        if (isColdStart) {
          document.documentElement.classList.add("splash-booting");
        }
        try {
          var av = localStorage.getItem("autonexis_user_avatar");
          if (av && !av.startsWith("data:") && !av.includes("?v=")) {
            localStorage.removeItem("autonexis_user_avatar");
          }
        } catch (e) {}
        try {
          var saved = localStorage.getItem("autonexis_theme");
          var resolved = saved;
          if (!saved || saved === "auto") {
            resolved = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
          }
          document.documentElement.setAttribute("data-theme", resolved);
          document.documentElement.style.colorScheme = resolved;
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="autonexis-splash" role="status" aria-label="Loading AUTONEXIS Assistant">
      <div class="anx-splash-inner">
        <div class="anx-splash-mark-wrap">
          <img src="/brand/logo-mark.png" alt="AUTONEXIS" class="anx-splash-mark-img" />
        </div>
        <div class="anx-splash-wordmark">AUTONEXIS</div>
        <div class="anx-splash-tagline">Your AI Assistant</div>
        <div class="anx-splash-line-track" aria-hidden="true">
          <div class="anx-splash-line-bar"></div>
        </div>
        <div class="anx-splash-slow" id="anx-splash-slow">
          <p>Taking longer than usual to load.</p>
          <button type="button" class="anx-splash-reload-btn" id="autonexis-fallback-reload">Reload</button>
        </div>
      </div>
    </div>

    <div id="root"></div>

    <script>
      (function() {
        var splash = document.getElementById("autonexis-splash");
        try {
          if (sessionStorage.getItem("autonexis_splash_done") === "1" && splash) {
            splash.classList.add("is-hidden");
            splash.style.display = "none";
          }
        } catch (e) {}

        var slowTimer = setTimeout(function() {
          var slowBox = document.getElementById("anx-splash-slow");
          var isStillVisible = splash && splash.style.display !== "none" && !splash.classList.contains("is-hidden");
          if (isStillVisible && slowBox) {
            slowBox.classList.add("visible");
          } else if (!window.__AUTONEXIS_MOUNTED__) {
            var root = document.getElementById("root");
            if (root && root.children.length === 0) {
              if (splash) {
                splash.classList.remove("is-hidden");
                splash.style.display = "flex";
              }
              if (slowBox) slowBox.classList.add("visible");
            }
          }
        }, 8000);

        var btn = document.getElementById("autonexis-fallback-reload");
        if (btn) {
          btn.onclick = function() {
            try {
              if ("serviceWorker" in navigator) {
                navigator.serviceWorker.getRegistrations().then(function(regs) {
                  for (var i = 0; i < regs.length; i++) regs[i].unregister();
                });
              }
              if ("caches" in window) {
                caches.keys().then(function(keys) {
                  for (var j = 0; j < keys.length; j++) caches.delete(keys[j]);
                });
              }
              sessionStorage.removeItem("autonexis_splash_done");
            } catch (e) {}
            window.location.reload();
          };
        }

        // Cancel slow fallback once React removes splash
        window.addEventListener("load", function() {
          setTimeout(function() {
            if (window.__AUTONEXIS_MOUNTED__ && splash && splash.classList.contains("is-hidden")) {
              clearTimeout(slowTimer);
            }
          }, 1000);
        });
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
